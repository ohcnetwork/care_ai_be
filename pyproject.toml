[project]
name = "care_ai_be"
version = "0.1.0"
description = "AI assistant plugin for Care, powered by the OpenAI Agents SDK"
readme = "README.md"
authors = [
  {name = "Open Health Care Network", email = "support@ohc.network"}
]
license = {text = "MIT"}
requires-python = ">= 3.13"
dependencies = [
    "django>=6.0",
    "djangorestframework",
    "openai-agents>=0.1.0",
    "jsonschema>=4.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["ruff"]

[project.urls]
homepage = "https://github.com/ohcnetwork/care_ai_be"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
